# Скопируйте в profile.yaml (файл в .gitignore) и заполните.
# Wizard: python setup_wizard.py

candidate:
  # Обязательно. Имя в промпте сопроводительного.
  name: ""

  # Необязательно. Город / формат локации для письма.
  location: ""

  # Обязательно, не пустой список. Целевые роли для промпта письма.
  # Это НЕ строки поиска на HH (см. hh.search_queries).
  desired_positions: []

  # Обязательно. Краткий опыт — основной блок фактов для LLM при генерации письма.
  experience_summary: ""

  # Необязательно. Образование.
  education: ""

  # Необязательно. Навыки и инструменты.
  technologies: []

  # Необязательно. Проекты / кейсы.
  projects: []

  # Необязательно. Единственный URL, который можно оставить в письме.
  github_url: ""

  # Необязательно. Зарплатные ожидания (модель может упомянуть в финале письма).
  salary_expectation: ""

  # Необязательно. В промпт; если есть «удалённо» или remote —
  # поиск HH идёт с schedule=remote.
  work_format: []

  # Необязательно. Доп. стоп-слова в заголовке вакансии (плюс встроенный фильтр).
  excluded_positions: []

  # Необязательно. Свободный текст: занятость, приоритеты, сайт и т.п.
  additional_information: ""

hh:
  # Обязательно. Точное имя резюме в селекторе HH при отклике.
  resume_name: ""

  # Обязательно. Запросы поиска на HH; агент обходит каждый.
  search_queries: []

  # Необязательно. ID регионов HH (1 = Москва, 2 = СПб). [] = без геофильтра.
  # Не пишите названия городов текстом.
  areas: []

  # Необязательно. Коды опыта HH:
  # noExperience | between1And3 | between3And6 | moreThan6
  # [] = любой опыт.
  experience_filters: []

cover_letter:
  # Язык письма для промпта.
  language: "ru"

  # Лимит символов письма (у HH поле ~10000). При превышении — обрезка по предложению.
  max_length: 1800

  # Тон промпта, например professional.
  style: "professional"
